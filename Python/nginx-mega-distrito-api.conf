server {
    listen 80;
    server_name mega-distrito-api.exksvol.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Depois de configurar o DNS e testar o acesso por HTTP, rode:
#   sudo certbot --nginx -d mega-distrito-api.exksvol.com
# para emitir o certificado HTTPS e o certbot atualiza este arquivo automaticamente.
